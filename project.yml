name: HealthChat
options:
  bundleIdPrefix: com.junyizhang
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Siri 短语是按 app 的开发语言登记的。这一项留在 en 的话,`VanaShortcuts` 里写的中文
  # 在中文 Siri 上一句都匹配不上——界面本来就全是中文,开发语言也该是中文。
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 生成 Info.plist 时 CFBundleDevelopmentRegion 取的是这个,不是上面那个 project 属性。
    DEVELOPMENT_LANGUAGE: zh-Hans
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    # 真机调试签名用的团队。只是开发签名——没有在 App Store Connect 建过 app 记录,
    # 所以 bundle id 还没被这个团队占住,以后换个人账号不受影响。
    DEVELOPMENT_TEAM: TBZQNF7555
packages:
  AIKitSwift:
    path: ../aikitswift
  AgentRuntime:
    path: AgentRuntime
targets:
  HealthChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthChatTests
    dependencies:
      - target: HealthChat
      - package: AgentRuntime
        product: AgentRuntime
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HealthChat:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - HealthChatTests
    sources:
      - path: HealthChat
    dependencies:
      - package: AgentRuntime
        product: AgentRuntime
      - package: AIKitSwift
        product: AIKit
    entitlements:
      path: HealthChat/HealthChat.entitlements
      properties:
        com.apple.developer.healthkit: true
        # 读体检报告和化验单要单独的 access 权限,只申请 health-records 这一项。
        com.apple.developer.healthkit.access:
          - health-records
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junyizhang.HealthChat
        PRODUCT_NAME: HealthChat
        # Icon Composer 的 HealthChat/AppIcon.icon,名字要和这里对上。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # 用户看到的名字是 Vana;target、bundle id 和 Keychain service 仍叫 HealthChat,
        # 换掉它们会让已存的 API key 和已授权的健康数据都对不上。
        INFOPLIST_KEY_CFBundleDisplayName: Vana
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: 用于在对话中分析你的步数、睡眠、心率等健康数据;端上模型模式下数据不离开设备。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 仅在开发版本中写入模拟健康数据，用于验证查询和分析结果。
        INFOPLIST_KEY_NSHealthClinicalHealthRecordsShareUsageDescription: 用于在对话中读取你已连接到「健康」的化验和体检记录；数据只在你提问时被读取，不会被修改。
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: targeted
