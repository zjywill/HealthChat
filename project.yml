name: HealthChat
options:
  bundleIdPrefix: com.junyizhang
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
packages:
  AIKitSwift:
    path: ../aikitswift
targets:
  HealthChat:
    type: application
    platform: iOS
    sources:
      - path: HealthChat
    dependencies:
      - package: AIKitSwift
        product: AIKit
    entitlements:
      path: HealthChat/HealthChat.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junyizhang.HealthChat
        PRODUCT_NAME: HealthChat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HealthChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: 用于在对话中分析你的步数、睡眠、心率等健康数据;端上模型模式下数据不离开设备。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 仅在开发版本中写入模拟健康数据，用于验证查询和分析结果。
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: targeted
